services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qahub
      POSTGRES_PASSWORD: qahub
      POSTGRES_DB: qahub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qahub -d qahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+asyncpg://qahub:qahub@db:5432/qahub
      LLM_PROVIDER: mock
      RUNNER_URL: http://runner:8787
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  runner:
    build: ./apps/runner
    environment:
      API_URL: http://api:8000
    ports:
      - "8787:8787"
    volumes:
      - ./apps/runner:/app
    depends_on:
      - api
    command: node worker.js

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  pgdata:
