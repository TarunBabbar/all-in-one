[project]
name = "qahub-api"
version = "0.1.0"
description = "QA/One orchestration API — consolidated AI QA platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Eval gates. Used only for its BaseMetric / LLMTestCase contract — our
    # metrics score deterministically (no LLM judge), so the gates run offline.
    # Scores are higher-is-better since 4.2.2.
    "deepeval>=4.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: Query/Depends in defaults is the idiomatic FastAPI pattern.
# E501: verbose human-readable seed data (origins registry) legitimately
# exceeds 100 cols; code files still enforce it.
# E402: conftest must set DATABASE_URL/LLM_PROVIDER before app imports.
"app/api/*.py" = ["B008"]
"app/origins/seed.py" = ["E501"]
"app/connectors/*.py" = ["E501"]
"app/core/settings_store.py" = ["E501"]
"tests/*.py" = ["E501"]
"tests/conftest.py" = ["E402"]
